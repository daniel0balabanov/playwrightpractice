<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iframe Content</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { margin: 4px 0; display: block; padding: 6px 12px; }
  </style>
</head>
<body>
  <h2>Nested Form</h2>
  <form id="iframe-form">
    <label for="iframe-name">Name:</label>
    <input type="text" id="iframe-name" name="name" placeholder="Enter name">
    <label for="iframe-email">Email:</label>
    <input type="email" id="iframe-email" name="email" placeholder="Enter email">
    <button type="submit" id="iframe-submit">Submit</button>
  </form>
  <p id="iframe-result"></p>
  <script>
    document.getElementById('iframe-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('iframe-name').value;
      document.getElementById('iframe-result').textContent = 'Submitted: ' + name;
    });
  </script>
</body>
</html>
